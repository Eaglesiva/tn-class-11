name: SCERT Class 11 Cloud Edition Update (4 Batches)

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch number to run (1, 2, 3, or 4)'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  cloud_download_and_split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pymupdf requests

      - name: Run Cloud Edition Processing Script
        run: |
          python scripts/cloud_runner_c11_update.py ${{ github.event.inputs.batch || '2' }}

      - name: Commit and Push Batch Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add english/ physics_tm/ physics_em/ chemistry_tm/ chemistry_em/ botany_tm/ botany_em/ zoology_tm/ zoology_em/ computer_science_tm/ computer_science_em/ commerce_tm/ commerce_em/ accountancy_tm/ accountancy_em/ economics_tm/ economics_em/ history_em/ geography_em/ political_science_em/ docs/
          git commit -m "feat(scert): cloud download, verify and split Class 11 Batch ${{ github.event.inputs.batch || '2' }}" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
